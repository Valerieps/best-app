# Runs the same build Cloudflare Pages runs (typecheck, unit tests, production build) on every
# pull request, so a broken change is caught before it reaches main and not only before deploy
# (ADR-058). Runs on GitHub, not in the app: it adds no network call to the app (google-safe.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
